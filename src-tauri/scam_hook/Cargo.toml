[package]
name = "scam_hook"
version = "0.1.0"
edition = "2021"

[lib]
name = "scam_hook"
crate-type = ["cdylib"]

[dependencies]
minhook-sys = "0.1"
once_cell = "1"
widestring = "1"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_ProcessStatus",
    "Win32_Security",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
