[workspace]
members = [".", "appid_hook"]

[package]
name = "clemtout-launcher"
version = "2.1.0"
description = "Clemtout Launcher Modern Rust & React Edition"
authors = ["ClemtoutLauncher Team"]
edition = "2024"

[lib]
name = "clemtout_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clemtout-launcher"
path = "src/main.rs"

[[bin]]
name = "steam_ach_sync"
path = "src/bin/steam_ach_sync.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
walkdir = "2"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_Security",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
